<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MidContext</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <!-- Profile Selection Modal -->
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <h2 data-i18n="modal_title">Select Your Profile</h2>
        
        <div class="modal-section">
          <label class="modal-label" data-i18n="select_profile">Who are you?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="profile" value="support" />
              <span data-i18n="profile_support">IT Support</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="profile" value="enduser" />
              <span data-i18n="profile_enduser">End User</span>
            </label>
          </div>
        </div>

        <div class="modal-section">
          <label class="modal-label" data-i18n="user_name_label">Your Name</label>
          <input type="text" id="userNameInput" placeholder="Enter your name" />
        </div>

        <div class="modal-section" id="supportStatusSection" class="hidden">
          <label class="modal-label" data-i18n="support_status_label">Your Status</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="supportStatus" value="free" checked />
              <span data-i18n="status_free">Available</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="supportStatus" value="busy" />
              <span data-i18n="status_busy">Busy</span>
            </label>
          </div>
        </div>

        <div class="modal-section">
          <label class="modal-label" data-i18n="select_language">Select your language</label>
          <select id="profileLanguageSelect">
            <option value="en" data-i18n="lang_english">English</option>
            <option value="it" data-i18n="lang_italian">Italian</option>
            <option value="fi" data-i18n="lang_finnish">Finnish</option>
          </select>
        </div>

        <div class="modal-section">
          <label class="modal-label" data-i18n="session_type">Session Mode</label>
          <div class="radio-group" id="sessionModeGroup">
            <!-- End User modes (shown by default) -->
            <div id="endUserModes" class="hidden">
              <label class="radio-label">
                <input type="radio" name="sessionMode" value="create" checked />
                <span data-i18n="session_create">Join Support Session</span>
              </label>
            </div>
            
            <!-- Support modes (shown when Support is selected) -->
            <div id="supportModes" class="hidden">
              <label class="radio-label">
                <input type="radio" name="sessionMode" value="pool" checked />
                <span data-i18n="session_pool_wait">Wait for Support Request</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="sessionMode" value="create" />
                <span data-i18n="session_create_direct">Create Direct Session</span>
              </label>
            </div>
          </div>
        </div>

        <div id="joinSessionSection" class="modal-section hidden">
          <label class="modal-label" data-i18n="session_code_label">Enter Session Code</label>
          <input type="text" id="sessionCodeInput" placeholder="e.g., ABC123" maxlength="6" style="text-transform: uppercase;" />
        </div>

        <button id="profileSubmitButton" type="button" data-i18n="button_start">Start Session</button>
      </div>
    </div>

    <!-- Waiting for Connection Screen -->
    <div id="waitingView" class="modal hidden">
      <div class="modal-content waiting-content">
        <div class="waiting-container">
          <div class="loading-spinner">
            <div class="spinner-ring"></div>
          </div>
          <h2 id="waitingTitle" data-i18n="waiting_title">Connecting...</h2>
          <p id="waitingMessage" data-i18n="waiting_message">Please wait while we connect you</p>
          <p id="waitingSessionCode" class="session-code-display hidden"></p>
          <button id="cancelWaitingButton" type="button" class="cancel-btn" data-i18n="button_cancel">Cancel</button>
        </div>
      </div>
    </div>

    <main class="shell conversation-view hidden" id="conversationView">
      <!-- Top Header with Session Info -->
      <div class="voice-header">
        <div class="header-left">
          <h1 class="session-code" id="chatSessionCode">Session: -</h1>
          <span class="session-status" id="chatStatus">Disconnected</span>
        </div>
        <div class="header-right">
          <div class="ms-branding">
            <span>MidContext</span>
          </div>
          <button id="endSessionButton" type="button" disabled data-i18n="button_end">End Session</button>
        </div>
      </div>

      <!-- Voice Transcription Panel -->
      <div class="voice-panel">
        <div class="voice-indicator" id="voiceIndicator">
          <div class="voice-waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
          </div>
          <span class="voice-status" id="voiceStatus">Ready to listen</span>
        </div>
        
        <div class="transcription-area">
          <label class="transcription-label">Real-time Transcription</label>
          <div class="transcription-display" id="transcriptionDisplay">
            <p id="interimTranscript" class="interim-text"></p>
            <p id="finalTranscript" class="final-text"></p>
          </div>
        </div>
        
        <div class="voice-controls">
          <button id="voiceStartButton" class="voice-btn primary" title="Start listening">
            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 2C8.9 2 8 2.9 8 4V10C8 11.1 8.9 12 10 12C11.1 12 12 11.1 12 10V4C12 2.9 11.1 2 10 2ZM14.3 9C14.3 11.3 12.7 13.2 10.5 13.7V17H9.5V13.7C7.3 13.2 5.7 11.3 5.7 9H7C7 10.7 8.4 12 10 12C11.6 12 13 10.7 13 9H14.3Z" fill="currentColor"/>
            </svg>
            <span class="btn-label">Start Listening</span>
          </button>
          <button id="voiceStopButton" class="voice-btn danger hidden" title="Stop listening">
            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 5H12V15H8V5Z" fill="currentColor"/>
            </svg>
            <span class="btn-label">Stop</span>
          </button>
        </div>
      </div>

      <!-- Conversation Area -->
      <div class="conversation-container" id="conversationContainer">
        <!-- Messages will be added here dynamically -->
      </div>

      <!-- Text Input Area with Voice Controls -->
      <div class="chat-input-area">
        <div class="input-row">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Or type your message here..."
            rows="2"
          ></textarea>
          <div class="bottom-controls">
            <div id="voiceIndicatorBottom" class="voice-indicator-bottom hidden">
              <div class="voice-waves-small">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
              </div>
              <span class="voice-status-small" id="voiceStatusBottom">Listening...</span>
            </div>
            <button id="sendMessageButton" type="button" class="send-button">Send</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Hidden Controls for Backward Compatibility -->
    <div class="hidden">
      <select id="agentLanguage">
        <option value="en">English</option>
        <option value="it">Italian</option>
        <option value="fi">Finnish</option>
      </select>

      <select id="expectedUserLanguage">
        <option value="en">English</option>
        <option value="it">Italian</option>
        <option value="fi">Finnish</option>
      </select>

      <input id="sessionId" type="text" />
      <input id="status" type="text" />

      <button id="connectButton" type="button">Start Session</button>
      <button id="disconnectButton" type="button" disabled>End Session</button>
      <button id="speakButton" type="button" disabled>Start Recording</button>
      <button id="replayButton" type="button" disabled>Replay</button>

      <textarea id="transcriptInput"></textarea>
      <button id="sendTranscriptButton" type="button" disabled>Send</button>
      <button id="clearTranscriptButton" type="button">Clear</button>

      <textarea id="agentResponse"></textarea>
      <audio id="audioPlayer"></audio>

      <ol id="eventLog"></ol>
    </div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
